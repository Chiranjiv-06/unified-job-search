services:
  postgres:
    image: postgres:17-alpine
    container_name: ujs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-unified_job_search}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unified_job_search}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ujs-network

  redis:
    image: redis:7-alpine
    container_name: ujs-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ujs-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ujs-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in your .env file for production security}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set in your .env file for production security}"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-unified_job_search}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujs-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ujs-worker
    restart: unless-stopped
    command: [ "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info" ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in your .env file for production security}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set in your .env file for production security}"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-unified_job_search}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujs-network

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ujs-beat
    restart: unless-stopped
    command: [ "celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info" ]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in your .env file for production security}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set in your .env file for production security}"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-unified_job_search}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ujs-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ujs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ujs-network

volumes:
  pgdata:
  redisdata:
  uploads_data:

networks:
  ujs-network:
    driver: bridge
